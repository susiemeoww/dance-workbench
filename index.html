    <script>
    // ============================
    // Data Layer
    // ============================
    const Store = {
        get(k, d) { try { const v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch { return d; } },
        set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
    };
    const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

    let danceCategories = Store.get('dance_categories', ['路演','拍视频','广告','商演']);
    let filmingCategories = Store.get('filming_categories', ['短视频','教学','翻跳MV','分享']);
    const PROGRESS_STEPS = ['脚本阶段','拍摄阶段','剪辑阶段','品牌审核阶段','发布阶段','已完成'];

    let currentPage = 'dance-list';
    let viewMode = { 'dance-list':'list', 'video-edit':'list', 'filming':'list' };
    let currentNoteId = null;
    let calendarDate = new Date();
    let isNoteEditing = false;

    // ============================
    // Navigation
    // ============================
    document.querySelectorAll('.tab-item').forEach(item => {
        item.addEventListener('click', () => {
            document.querySelectorAll('.tab-item').forEach(n => n.classList.remove('active'));
            item.classList.add('active');
            currentPage = item.dataset.page;
            isNoteEditing = false; currentNoteId = null;
            renderPage(); scrollToTop();
        });
    });
    function scrollToTop() { document.getElementById('page-area').scrollTop = 0; }
    function handleFab() {
        switch(currentPage) {
            case 'dance-list': openDanceTodoSheet(); break;
            case 'video-edit': openVideoTodoSheet(); break;
            case 'filming': openFilmingTodoSheet(); break;
            case 'collab-track': openProjectSheet(); break;
            case 'ideas': openNoteTypeSheet(); break;
        }
    }

    // ============================
    // Toast
    // ============================
    function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }

    // ============================
    // Data Import/Export (兼容旧版)
    // ============================
    function openDataMenu() {
        showSheet(`
            <div class="sheet-handle"></div><div class="sheet-title">数据管理</div>
            <div class="sheet-field"><div class="sheet-label">导出数据（复制全部数据到剪贴板，可粘贴到备忘录保存）</div>
                <div class="data-menu"><button class="btn btn-primary" onclick="exportData()">复制导出数据</button></div>
            </div>
            <div class="sheet-field"><div class="sheet-label">导入数据（粘贴之前导出的数据，覆盖当前所有数据，兼容上个版本）</div>
                <textarea class="import-textarea" id="import-data" placeholder="在此粘贴之前导出的数据..."></textarea>
                <div class="data-menu" style="margin-top:8px;"><button class="btn btn-primary" id="import-btn" onclick="importData()">导入数据</button></div>
            </div>
            <div class="sheet-actions">
                <button class="btn btn-danger" onclick="confirmClearAll()" style="flex:0 0 auto; padding:10px 20px;">清空所有数据</button>
                <button class="btn btn-secondary" onclick="closeSheet()">关闭</button>
            </div>`);
    }
    function exportData() {
        const data = {
            version: 2,
            dance_todos: Store.get('dance_todos', []),
            dance_categories: Store.get('dance_categories', []),
            video_todos: Store.get('video_todos', []),
            filming_todos: Store.get('filming_todos', []),
            filming_categories: Store.get('filming_categories', []),
            projects: Store.get('projects', []),
            notes: Store.get('notes', []),
            exportedAt: new Date().toISOString()
        };
        const json = JSON.stringify(data, null, 2);
        navigator.clipboard.writeText(json).then(() => { closeSheet(); toast('✅ 数据已复制到剪贴板！'); }).catch(() => toast('复制失败，请手动选择文本'));
    }
    function importData() {
        const raw = document.getElementById('import-data').value.trim();
        if (!raw) { toast('请先粘贴数据'); return; }
        try {
            const data = JSON.parse(raw);
            // Migrate notes: ensure each note has type, subTodos, scriptRows
            let notes = data.notes || [];
            notes = notes.map(n => {
                if (!n.type) n.type = 'blank';
                if (!n.subTodos) n.subTodos = [];
                if (!n.images) n.images = [];
                if (n.type === 'script' && !n.scriptRows) n.scriptRows = [{ col1:'', col2:'', col3:'' }];
                return n;
            });
            // Migrate todos: ensure subTodos
            const migrateTodos = (todos) => (todos || []).map(t => { if (!t.subTodos) t.subTodos = []; return t; });
            const migrateProjects = (projects) => (projects || []).map(p => {
                if (p.todos) p.todos = p.todos.map(t => { if (!t.subTodos) t.subTodos = []; return t; });
                return p;
            });
            if (data.dance_todos) Store.set('dance_todos', migrateTodos(data.dance_todos));
            if (data.dance_categories) { Store.set('dance_categories', data.dance_categories); danceCategories = data.dance_categories; }
            if (data.video_todos) Store.set('video_todos', migrateTodos(data.video_todos));
            if (data.filming_todos) Store.set('filming_todos', migrateTodos(data.filming_todos));
            if (data.filming_categories) { Store.set('filming_categories', data.filming_categories); filmingCategories = data.filming_categories; }
            if (data.projects) Store.set('projects', migrateProjects(data.projects));
            if (data.notes) Store.set('notes', notes);
            closeSheet(); toast('✅ 数据导入成功！');
            renderPage();
        } catch(e) { toast('❌ 数据格式错误，请检查'); }
    }
    function confirmClearAll() {
        showSheet(`<div class="sheet-handle"></div><div class="sheet-title">⚠️ 确认清空</div>
            <p style="text-align:center; color:var(--text-light); margin-bottom:20px;">这将删除所有数据（建议先导出备份）</p>
            <div class="sheet-actions"><button class="btn btn-secondary" onclick="openDataMenu()">取消</button><button class="btn btn-primary" style="background:#e74c3c;" onclick="clearAllData()">确认清空</button></div>`);
    }
    function clearAllData() {
        ['dance_todos','dance_categories','video_todos','filming_todos','filming_categories','projects','notes'].forEach(k => localStorage.removeItem(k));
        danceCategories = ['路演','拍视频','广告','商演'];
        filmingCategories = ['短视频','教学','翻跳MV','分享'];
        closeSheet(); toast('🗑️ 所有数据已清空'); renderPage();
    }

    // ============================
    // Sheet
    // ============================
    function showSheet(html) {
        document.getElementById('sheet').innerHTML = html;
        document.getElementById('sheet-overlay').classList.add('show');
        setTimeout(() => { const input = document.getElementById('sheet').querySelector('.sheet-input'); if (input) input.focus(); }, 350);
    }
    function closeSheet() { document.getElementById('sheet-overlay').classList.remove('show'); }

    // ============================
    // Title Editor
    // ============================
    const DEFAULT_TITLE = '喵喵喵你要跳舞嘛';
    function getCustomTitle() { return Store.get('app_title', DEFAULT_TITLE); }
    function applyTitle() {
        const title = getCustomTitle();
        document.getElementById('top-title').textContent = title;
        document.title = title;
    }
    function openTitleEditor() {
        const current = getCustomTitle();
        showSheet(`<div class="sheet-handle"></div><div class="sheet-title">修改标题</div>
            <div class="sheet-field"><div class="sheet-label">自定义标题</div><input class="sheet-input" id="title-input" value="${esc(current)}" placeholder="输入标题..." maxlength="20"></div>
            <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">取消</button><button class="btn btn-primary" onclick="saveTitle()">保存</button></div>`);
    }
    function saveTitle() {
        const val = document.getElementById('title-input').value.trim() || DEFAULT_TITLE;
        Store.set('app_title', val);
        applyTitle();
        closeSheet();
        toast('✅ 标题已更新');
    }

    function renderPage() {
        const area = document.getElementById('page-area');
        document.getElementById('fab-btn').classList.remove('hidden');
        switch(currentPage) {
            case 'dance-list': renderDanceList(area); break;
            case 'video-edit': renderVideoEdit(area); break;
            case 'filming': renderFilming(area); break;
            case 'collab-track': renderCollabTrack(area); break;
            case 'ideas': renderIdeas(area); break;
        }
    }

    // ============================
    // Drag & Drop for todos
    // ============================
    let dragData = null;

    function setupTodoDrag(container, getTodos, saveTodos, renderFn) {
        const items = container.querySelectorAll('.todo-item[draggable]');
        items.forEach(item => {
            item.addEventListener('dragstart', (e) => {
                dragData = { id: item.dataset.id, type: 'todo' };
                item.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            });
            item.addEventListener('dragend', () => { item.classList.remove('dragging'); container.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); });
            item.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; item.classList.add('drag-over'); });
            item.addEventListener('dragleave', () => { item.classList.remove('drag-over'); });
            item.addEventListener('drop', (e) => {
                e.preventDefault();
                item.classList.remove('drag-over');
                if (!dragData || dragData.type !== 'todo') return;
                const fromId = dragData.id;
                const toId = item.dataset.id;
                if (fromId === toId) return;
                const todos = getTodos();
                const fromIdx = todos.findIndex(t => t.id === fromId);
                const toIdx = todos.findIndex(t => t.id === toId);
                if (fromIdx === -1 || toIdx === -1) return;
                const [moved] = todos.splice(fromIdx, 1);
                todos.splice(toIdx, 0, moved);
                saveTodos(todos);
                renderFn();
            });
        });
    }

    // Touch drag support
    function setupTodoTouchDrag(container, getTodos, saveTodos, renderFn) {
        const items = container.querySelectorAll('.todo-item[draggable]');
        let touchItem = null, touchId = null, startY = 0, clone = null, targetItem = null;

        items.forEach(item => {
            const handle = item.querySelector('.drag-handle');
            if (!handle) return;
            handle.addEventListener('touchstart', (e) => {
                e.preventDefault();
                touchItem = item; touchId = item.dataset.id;
                startY = e.touches[0].clientY;
                item.classList.add('dragging');
                clone = item.cloneNode(true);
                clone.style.position = 'fixed';
                clone.style.width = item.offsetWidth + 'px';
                clone.style.opacity = '0.8';
                clone.style.zIndex = '9999';
                clone.style.pointerEvents = 'none';
                clone.style.top = (e.touches[0].clientY - item.offsetHeight/2) + 'px';
                clone.style.left = item.getBoundingClientRect().left + 'px';
                document.body.appendChild(clone);
            }, { passive: false });

            handle.addEventListener('touchmove', (e) => {
                if (!touchItem) return;
                e.preventDefault();
                const y = e.touches[0].clientY;
                clone.style.top = (y - touchItem.offsetHeight/2) + 'px';
                // Find target
                const elems = document.elementsFromPoint(e.touches[0].clientX, y);
                const newTarget = elems.find(el => el.classList && el.classList.contains('todo-item') && el.dataset.id !== touchId);
                if (targetItem) targetItem.classList.remove('drag-over');
                targetItem = newTarget || null;
                if (targetItem) targetItem.classList.add('drag-over');
            }, { passive: false });

            handle.addEventListener('touchend', (e) => {
                if (!touchItem) return;
                touchItem.classList.remove('dragging');
                if (clone) { clone.remove(); clone = null; }
                if (targetItem) {
                    targetItem.classList.remove('drag-over');
                    const fromId = touchId;
                    const toId = targetItem.dataset.id;
                    if (fromId !== toId) {
                        const todos = getTodos();
                        const fromIdx = todos.findIndex(t => t.id === fromId);
                        const toIdx = todos.findIndex(t => t.id === toId);
                        if (fromIdx !== -1 && toIdx !== -1) {
                            const [moved] = todos.splice(fromIdx, 1);
                            todos.splice(toIdx, 0, moved);
                            saveTodos(todos);
                            renderFn();
                        }
                    }
                }
                touchItem = null; touchId = null; targetItem = null;
            }, { passive: false });
        });
    }

    // ============================
    // Generic Todo Item Renderer
    // ============================
    function renderTodoItemHTML(t, opts) {
        const page = opts.page;
        const showCategory = opts.showCategory !== false;
        const showDate = opts.showDate || false;
        let html = `<div class="todo-item" draggable="true" data-id="${t.id}">`;
        html += `<span class="drag-handle">⠿</span>`;
        html += `<div class="todo-checkbox ${t.done?'checked':''}" onclick="${opts.toggleFn}('${t.id}')"></div>`;
        html += `<div class="todo-main">`;
        html += `<div class="todo-text ${t.done?'done':''}" onclick="${opts.toggleFn}('${t.id}')">${esc(t.text)}</div>`;
        html += `<div class="todo-meta">`;
        if (showCategory && t.category) html += `<span class="todo-category cat-${getCatClass(t.category)}">${t.category}</span>`;
        if (showDate && t.publishDate) html += `<span class="todo-date">${t.publishDate}</span>`;
        html += `</div>`;
        // Sub-todos
        if (t.subTodos && t.subTodos.length > 0) {
            html += `<div class="sub-todos-container">`;
            t.subTodos.forEach((st, idx) => {
                html += `<div class="sub-todo-row">
                    <div class="sub-checkbox ${st.done?'checked':''}" onclick="toggleSubTodo('${page}','${t.id}','${st.id}')"></div>
                    <span class="sub-todo-text ${st.done?'done':''}" onclick="toggleSubTodo('${page}','${t.id}','${st.id}')">${esc(st.text)}</span>
                    <button class="sub-delete" onclick="deleteSubTodo('${page}','${t.id}','${st.id}')">✕</button>
                </div>`;
            });
            html += `</div>`;
        }
        html += `</div>`;
        html += `<div class="todo-actions">`;
        html += `<button class="todo-action-btn" onclick="openEditSheet('${page}','${t.id}')" title="编辑">✎</button>`;
        html += `<button class="todo-action-btn delete" onclick="deleteItem('${page}','${t.id}')">✕</button>`;
        html += `</div>`;
        html += `</div>`;
        return html;
    }

    // Sub-todo functions
    function addSubTodo(page, parentId) {
        const id = uid();
        showSheet(`<div class="sheet-handle"></div><div class="sheet-title">添加子待办</div>
            <div class="sheet-field"><div class="sheet-label">子待办内容</div><input class="sheet-input" id="sub-todo-text" placeholder="输入子待办..."></div>
            <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">取消</button><button class="btn btn-primary" onclick="saveSubTodo('${page}','${parentId}')">添加</button></div>`);
    }
    function saveSubTodo(page, parentId) {
        const text = document.getElementById('sub-todo-text').value.trim(); if (!text) return;
        const todos = getTodosByPage(page);
        const todo = todos.find(t => t.id === parentId);
        if (todo) { if (!todo.subTodos) todo.subTodos = []; todo.subTodos.push({ id: uid(), text, done: false }); saveTodosByPage(page, todos); }
        closeSheet(); renderPage();
    }
    function toggleSubTodo(page, parentId, subId) {
        const todos = getTodosByPage(page);
        const todo = todos.find(t => t.id === parentId);

    function renderCalendar(todos) {
        const year = calendarDate.getFullYear(); const month = calendarDate.getMonth();
        const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
        const todayStr = new Date().toDateString();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month+1, 0).getDate();
        const prevDays = new Date(year, month, 0).getDate();
        let cells = [];
        for (let i = firstDay-1; i >= 0; i--) cells.push({ day: prevDays-i, otherMonth: true });
        for (let d = 1; d <= daysInMonth; d++) {
            const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const events = todos.filter(t => t.publishDate === ds);
            cells.push({ day: d, otherMonth: false, ds, events, isToday: new Date(year,month,d).toDateString() === todayStr });
        }
        const rem = 42 - cells.length;
        for (let d = 1; d <= rem; d++) cells.push({ day: d, otherMonth: true });
        return `<div class="calendar"><div class="calendar-header"><button class="calendar-nav-btn" onclick="changeMonth(-1)">‹</button><span class="calendar-month">${year}年 ${monthNames[month]}</span><button class="calendar-nav-btn" onclick="changeMonth(1)">›</button></div>
            <div class="calendar-grid">${['日','一','二','三','四','五','六'].map(d => `<div class="calendar-day-header">${d}</div>`).join('')}
                ${cells.map(c => {
                    if (c.otherMonth) return `<div class="calendar-cell other-month"><span>${c.day}</span></div>`;
                    const evts = c.events || [];
                    const shown = evts.slice(0, 2);
                    const extra = evts.length - 2;
                    return `<div class="calendar-cell ${c.isToday?'today':''} ${evts.length>0?'has-events':''}" onclick="openVideoTodoSheet('${c.ds}')">
                        <span class="calendar-day-num">${c.day}</span>
                        ${shown.map(e => `<div class="cal-event ${e.done?'done':''}">${esc(e.text.substring(0,8))}</div>`).join('')}
                        ${extra > 0 ? `<div class="cal-more">+${extra}更多</div>` : ''}
                    </div>`;
                }).join('')}
            </div>
        </div>`;
    }
    function changeMonth(d) { calendarDate.setMonth(calendarDate.getMonth()+d); renderPage(); }
    function openVideoTodoSheet(prefillDate) {

            <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">取消</button><button class="btn btn-primary" onclick="addFilmingTodo()">添加</button></div>`);
    }
    function addFilmingTodo() { const text = document.getElementById('filming-todo-text').value.trim(); if (!text) return; saveFilmingTodos([...getFilmingTodos(), { id: uid(), text, category: document.getElementById('filming-todo-cat').value, done: false, subTodos: [], createdAt: Date.now() }]); closeSheet(); renderPage(); }
    function toggleFilmingTodo(id) { const todos = getFilmingTodos(); const t = todos.find(x => x.id === id); if (t) t.done = !t.done; saveFilmingTodos(todos); renderPage(); }

    // ============================
    // 4. Collab Track
    // ============================
    function getProjects() { return Store.get('projects', []); }
    function saveProjects(p) { Store.set('projects', p); }
    function renderCollabTrack(area) {
        const projects = getProjects();
        area.innerHTML = `<div class="page-header"><div class="page-title"><svg viewBox="0 0 24 24" fill="none" stroke="var(--kitty-pink)" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>合作 Track</div></div>
            <div id="project-content">${projects.length === 0 ? getEmptyState('还没有合作项目～\n点击右下角 + 创建吧') : projects.map(renderProjectCard).join('')}</div>`;
        // Setup drag for project todos
        projects.forEach(p => {
            const container = document.querySelector(`[data-project-id="${p.id}"]`);
            if (container) {
                const getTodos = () => { const proj = getProjects().find(x => x.id === p.id); return proj ? proj.todos || [] : []; };
                const saveTodos = (todos) => { const projs = getProjects(); const proj = projs.find(x => x.id === p.id); if (proj) { proj.todos = todos; saveProjects(projs); } };
                const renderFn = () => renderPage();
                setupTodoDrag(container, getTodos, saveTodos, renderFn);
                setupTodoTouchDrag(container, getTodos, saveTodos, renderFn);
            }
        });
    }
    function renderProjectCard(p) {
        const idx = PROGRESS_STEPS.indexOf(p.progress);
        return `<div class="project-card"><div class="project-card-header"><div><div class="project-name">${esc(p.name)}</div>${p.brand ? `<div class="project-brand">${esc(p.brand)}</div>` : ''}</div><button class="btn btn-danger btn-small" onclick="deleteProject('${p.id}')">删除</button></div>
            <div class="progress-steps">${PROGRESS_STEPS.map((step, i) => `<span class="progress-step ${i===idx?'active':''} ${i<idx?'completed':''}" onclick="setProjectProgress('${p.id}','${step}')">${step}</span>${i < PROGRESS_STEPS.length-1 ? '<span class="progress-arrow">›</span>' : ''}`).join('')}</div>
            <div class="project-todos" data-project-id="${p.id}">
                ${(p.todos||[]).map(t => renderTodoItemHTML(t, { page:'project', toggleFn:`toggleProjectTodo('${p.id}')`, showCategory:false })).join('')}
                <div class="add-project-todo"><button class="btn btn-secondary btn-small" onclick="openProjectTodoSheet('${p.id}')">+ 添加待办</button></div>
            </div></div>`;
    }
    // Override renderTodoItemHTML toggleFn for project todos
    function renderProjectTodoItem(t, projectId) {
        const html = renderTodoItemHTML(t, { page:'project', toggleFn:`(function(){toggleProjectTodo('${projectId}','${t.id}')})`, showCategory:false });
        return html.replace(`onclick="${`(function(){toggleProjectTodo('${projectId}','${t.id}')})`}"`, `onclick="toggleProjectTodo('${projectId}','${t.id}')"`);
    }
    function openProjectSheet() {
        showSheet(`<div class="sheet-handle"></div><div class="sheet-title">新建合作项目</div>
            <div class="sheet-field"><div class="sheet-label">项目名称</div><input class="sheet-input" id="project-name" placeholder="如：XX品牌秋季广告"></div>
            <div class="sheet-field"><div class="sheet-label">品牌（可选）</div><input class="sheet-input" id="project-brand" placeholder="品牌名称"></div>
            <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">取消</button><button class="btn btn-primary" onclick="addProject()">创建</button></div>`);
    }
    function addProject() { const name = document.getElementById('project-name').value.trim(); if (!name) return; saveProjects([...getProjects(), { id: uid(), name, brand: document.getElementById('project-brand').value.trim(), progress: '脚本阶段', todos: [], createdAt: Date.now() }]); closeSheet(); renderPage(); }
    function deleteProject(id) { saveProjects(getProjects().filter(p => p.id !== id)); renderPage(); }
    function setProjectProgress(id, step) { const projects = getProjects(); const p = projects.find(x => x.id === id); if (p) p.progress = step; saveProjects(projects); renderPage(); }
    function openProjectTodoSheet(pid) {
        showSheet(`<div class="sheet-handle"></div><div class="sheet-title">添加项目待办</div>
            <div class="sheet-field"><div class="sheet-label">待办内容</div><input class="sheet-input" id="project-todo-text" placeholder="输入待办事项..."></div>
            <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">取消</button><button class="btn btn-primary" onclick="addProjectTodo('${pid}')">添加</button></div>`);
    }
    function addProjectTodo(pid) { const text = document.getElementById('project-todo-text').value.trim(); if (!text) return; const projects = getProjects(); const p = projects.find(x => x.id === pid); if (p) { if (!p.todos) p.todos = []; p.todos.push({ id: uid(), text, done: false, subTodos: [] }); } saveProjects(projects); closeSheet(); renderPage(); }
    function toggleProjectTodo(pid, tid) { const projects = getProjects(); const p = projects.find(x => x.id === pid); if (p) { const t = p.todos.find(x => x.id === tid); if (t) t.done = !t.done; } saveProjects(projects); renderPage(); }

    // ============================
    // 5. Ideas (Notes) — with blank/script types
    // ============================
    function getNotes() { return Store.get('notes', []); }
    function saveNotes(n) { Store.set('notes', n); }

    function openNoteTypeSheet() {
        showSheet(`<div class="sheet-handle"></div><div class="sheet-title">新建备忘</div>
            <div class="create-type-grid">
                <div class="create-type-btn selected" id="type-blank" onclick="selectNoteType('blank')">
                    <div class="create-type-icon">📝</div><div class="create-type-label">空白页</div><div class="create-type-desc">自由记录想法</div>
                </div>
                <div class="create-type-btn" id="type-script" onclick="selectNoteType('script')">
                    <div class="create-type-icon">🎬</div><div class="create-type-label">脚本</div><div class="create-type-desc">段落/画面/服装</div>
                </div>
            </div>
            <div class="sheet-field"><div class="sheet-label">标题</div><input class="sheet-input" id="note-title-input" placeholder="输入标题..."></div>
            <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">取消</button><button class="btn btn-primary" onclick="createNoteFromType()">创建</button></div>`);
    }
    let selectedNoteType = 'blank';
    function selectNoteType(type) {
        selectedNoteType = type;
        document.getElementById('type-blank').classList.toggle('selected', type === 'blank');
        document.getElementById('type-script').classList.toggle('selected', type === 'script');
    }
    function createNoteFromType() {
        const title = document.getElementById('note-title-input').value.trim();
        const notes = getNotes();
        const note = { id: uid(), title, type: selectedNoteType, createdAt: Date.now(), updatedAt: Date.now() };
        if (selectedNoteType === 'script') {
            note.scriptRows = [{ id: uid(), col1: '', col2: '', col3: '' }];
        } else {
            note.body = '';
        }
        notes.push(note);
        saveNotes(notes);
        currentNoteId = note.id;
        isNoteEditing = true;
        closeSheet();
        renderPage();
    }

    function renderIdeas(area) {
        const notes = getNotes().sort((a,b) => b.updatedAt - a.updatedAt);
        const fab = document.getElementById('fab-btn');
        const tabBar = document.getElementById('tab-bar');
        if (isNoteEditing && currentNoteId) {
            const note = notes.find(n => n.id === currentNoteId);
            if (!note) { isNoteEditing = false; renderIdeas(area); return; }
            fab.classList.add('hidden'); tabBar.classList.add('hidden');
            if (note.type === 'script') {
                area.innerHTML = renderScriptEditor(note);
            } else {
                const images = note.images || [];
                area.innerHTML = `<div class="note-editor-page">
                    <button class="note-editor-back" onclick="backToNoteList()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>备忘录</button>
                    <input class="note-title-input" id="note-title" value="${esc(note.title||'')}" placeholder="标题" oninput="updateNoteField('${note.id}','title',this.value)">
                    <div class="note-meta">${fmtDate(note.updatedAt)} · 最后修改</div>
                    <div class="note-toolbar">
                        <button class="note-tool-btn" onclick="document.getElementById('note-img-input').click()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            插入图片
                        </button>
                        <input type="file" id="note-img-input" accept="image/*" style="display:none" onchange="handleNoteImage('${note.id}', this)">
                    </div>
                    <div class="note-images-container" id="note-images">
                        ${images.map((img, idx) => `<div class="note-image-wrapper">
                            <img src="${img}" alt="图片${idx+1}">
                            <button class="note-image-del" onclick="deleteNoteImage('${note.id}', ${idx})">✕</button>
                        </div>`).join('')}
                    </div>
                    <textarea class="note-body-input" id="note-body" placeholder="写下你的 ideas ✨" oninput="updateNoteField('${note.id}','body',this.value)">${esc(note.body||'')}</textarea>
                </div>`;
            }
        } else {
            fab.classList.remove('hidden'); tabBar.classList.remove('hidden');
            area.innerHTML = `<div class="page-header"><div class="page-title"><svg viewBox="0 0 24 24" fill="none" stroke="var(--kitty-pink)" stroke-width="2"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/></svg>视频 Ideas</div></div>
                <div id="notes-list">${notes.length === 0 ? getEmptyState('还没有备忘录～\n点击右下角 + 创建吧') : notes.map((n, idx) => `
                    <div class="notes-list-item" draggable="true" data-id="${n.id}" data-idx="${idx}">
                        <span class="note-drag-handle">⠿</span>
                        <div class="notes-list-item-left" onclick="openNote('${n.id}')">
                            <div class="notes-list-title">${esc(n.title||'新备忘')} <span class="note-type-badge note-type-${n.type||'blank'}">${n.type==='script'?'脚本':'空白'}</span></div>
                            <div class="notes-list-preview">${n.type==='script' ? `${(n.scriptRows||[]).length} 段落` : `${(n.body||'').substring(0,40)||'没有附加文字'}${(n.images&&n.images.length>0)?` · 📷${n.images.length}张`:''}`}</div>
                        </div>
                        <div class="notes-list-date">${fmtDateShort(n.updatedAt)}</div>
                        <button class="todo-action-btn delete" onclick="event.stopPropagation();deleteNote('${n.id}')" style="margin-left:4px;">✕</button>
                    </div>`).join('')}</div>`;
            setupNotesDrag(document.getElementById('notes-list'));
        }
    }

    function renderScriptEditor(note) {
        const rows = note.scriptRows || [{ id: uid(), col1: '', col2: '', col3: '' }];
        return `<div class="note-editor-page">
            <button class="note-editor-back" onclick="backToNoteList()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>备忘录</button>
            <input class="note-title-input" id="note-title" value="${esc(note.title||'')}" placeholder="脚本标题" oninput="updateNoteField('${note.id}','title',this.value)">
            <div class="note-meta">${fmtDate(note.updatedAt)} · 脚本模式 · ${rows.length} 段落</div>
            <div class="script-table" id="script-table">
                <div class="script-header"><div class="script-col-1">段落</div><div class="script-col-2">画面介绍</div><div class="script-col-3">服装</div></div>
                ${rows.map((r, idx) => `
                    <div class="script-row-wrapper" data-row-id="${r.id}">
                        <button class="script-row-del-btn" onclick="deleteScriptRow('${note.id}','${r.id}')">✕</button>
                        <div class="script-row">
                            <div class="script-cell script-col-1"><textarea class="script-cell-input" placeholder="段落${idx+1}" oninput="updateScriptCell('${note.id}','${r.id}','col1',this.value)">${esc(r.col1||'')}</textarea></div>
                            <div class="script-cell script-col-2"><textarea class="script-cell-input" placeholder="画面描述" oninput="updateScriptCell('${note.id}','${r.id}','col2',this.value)">${esc(r.col2||'')}</textarea></div>
                            <div class="script-cell script-col-3"><textarea class="script-cell-input" placeholder="服装" oninput="updateScriptCell('${note.id}','${r.id}','col3',this.value)">${esc(r.col3||'')}</textarea></div>
                        </div>
                    </div>`).join('')}
                <div class="script-add-row"><button class="btn btn-secondary btn-small" onclick="addScriptRow('${note.id}')">+ 添加段落</button></div>
            </div>
        </div>`;
    }

    function updateScriptCell(noteId, rowId, col, value) {
        const notes = getNotes();
        const n = notes.find(x => x.id === noteId);
        if (n && n.scriptRows) { const r = n.scriptRows.find(x => x.id === rowId); if (r) { r[col] = value; n.updatedAt = Date.now(); saveNotes(notes); } }
    }
    function addScriptRow(noteId) {
        const notes = getNotes();
        const n = notes.find(x => x.id === noteId);
        if (n) { if (!n.scriptRows) n.scriptRows = []; n.scriptRows.push({ id: uid(), col1: '', col2: '', col3: '' }); n.updatedAt = Date.now(); saveNotes(notes); renderPage(); }
    }
    function deleteScriptRow(noteId, rowId) {
        const notes = getNotes();
        const n = notes.find(x => x.id === noteId);
        if (n && n.scriptRows) { n.scriptRows = n.scriptRows.filter(r => r.id !== rowId); n.updatedAt = Date.now(); saveNotes(notes); renderPage(); }
    }
    function deleteNote(id) { saveNotes(getNotes().filter(n => n.id !== id)); renderPage(); }
    function openNote(id) { currentNoteId = id; isNoteEditing = true; renderPage(); }
    function backToNoteList() { isNoteEditing = false; currentNoteId = null; renderPage(); }
    function updateNoteField(id, field, value) { const notes = getNotes(); const n = notes.find(x => x.id === id); if (n) { n[field] = value; n.updatedAt = Date.now(); saveNotes(notes); } }

    // Note image functions
    function handleNoteImage(noteId, input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                // Compress image
                const canvas = document.createElement('canvas');
                const maxW = 800, maxH = 1200;
                let w = img.width, h = img.height;
                if (w > maxW) { h = h * maxW / w; w = maxW; }
                if (h > maxH) { w = w * maxH / h; h = maxH; }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                let compressed = canvas.toDataURL('image/jpeg', 0.7);
                // If still too large, reduce quality
                while (compressed.length > 200000 && compressed.length > 50000) {
                    const q = Math.max(0.3, (compressed.length - 50000) / compressed.length * 0.7);
                    compressed = canvas.toDataURL('image/jpeg', q);
                    if (q <= 0.3) break;
                }
                // Save to note
                const notes = getNotes();
                const n = notes.find(x => x.id === noteId);
                if (n) {
                    if (!n.images) n.images = [];
                    n.images.push(compressed);
                    n.updatedAt = Date.now();
                    saveNotes(notes);
                    // Refresh images display
                    const container = document.getElementById('note-images');
                    if (container) {
                        container.innerHTML = n.images.map((im, idx) => `<div class="note-image-wrapper">
                            <img src="${im}" alt="图片${idx+1}">
                            <button class="note-image-del" onclick="deleteNoteImage('${noteId}', ${idx})">✕</button>
                        </div>`).join('');
                    }
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
        input.value = ''; // Reset input
    }
    function deleteNoteImage(noteId, idx) {
        const notes = getNotes();
        const n = notes.find(x => x.id === noteId);
        if (n && n.images) {
            n.images.splice(idx, 1);
            n.updatedAt = Date.now();
            saveNotes(notes);
            // Refresh display
            const container = document.getElementById('note-images');
            if (container) {
                container.innerHTML = (n.images||[]).map((im, i) => `<div class="note-image-wrapper">
                    <img src="${im}" alt="图片${i+1}">
                    <button class="note-image-del" onclick="deleteNoteImage('${noteId}', ${i})">✕</button>
                </div>`).join('');
            }
        }
    }

    // Notes drag
    function setupNotesDrag(container) {
        if (!container) return;
        const items = container.querySelectorAll('.notes-list-item');
        let touchItem = null, touchId = null, clone = null, targetItem = null;
        items.forEach(item => {
            item.addEventListener('dragstart', (e) => { dragData = { id: item.dataset.id, type: 'note' }; item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
            item.addEventListener('dragend', () => { item.classList.remove('dragging'); container.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); });
            item.addEventListener('dragover', (e) => { e.preventDefault(); if (dragData && dragData.type === 'note') item.classList.add('drag-over'); });
            item.addEventListener('dragleave', () => { item.classList.remove('drag-over'); });
            item.addEventListener('drop', (e) => {
                e.preventDefault(); item.classList.remove('drag-over');
                if (!dragData || dragData.type !== 'note') return;
                const fromId = dragData.id; const toId = item.dataset.id;
                if (fromId === toId) return;
                const notes = getNotes();
                const fromIdx = notes.findIndex(n => n.id === fromId);
                const toIdx = notes.findIndex(n => n.id === toId);
                if (fromIdx === -1 || toIdx === -1) return;
                const [moved] = notes.splice(fromIdx, 1);
                notes.splice(toIdx, 0, moved);
                saveNotes(notes); renderPage();
            });
        });
        // Touch
        items.forEach(item => {
            const handle = item.querySelector('.note-drag-handle');
            if (!handle) return;
            handle.addEventListener('touchstart', (e) => {
                e.preventDefault(); touchItem = item; touchId = item.dataset.id;
                item.classList.add('dragging');
                clone = item.cloneNode(true); clone.style.position = 'fixed'; clone.style.width = item.offsetWidth+'px'; clone.style.opacity = '0.8'; clone.style.zIndex = '9999'; clone.style.pointerEvents = 'none'; clone.style.top = (e.touches[0].clientY - item.offsetHeight/2)+'px'; clone.style.left = item.getBoundingClientRect().left+'px'; document.body.appendChild(clone);
            }, { passive: false });
            handle.addEventListener('touchmove', (e) => {
                if (!touchItem) return; e.preventDefault();
                const y = e.touches[0].clientY; clone.style.top = (y - touchItem.offsetHeight/2)+'px';
                const elems = document.elementsFromPoint(e.touches[0].clientX, y);
                const newTarget = elems.find(el => el.classList && el.classList.contains('notes-list-item') && el.dataset.id !== touchId);
                if (targetItem) targetItem.classList.remove('drag-over');
                targetItem = newTarget || null; if (targetItem) targetItem.classList.add('drag-over');
            }, { passive: false });
            handle.addEventListener('touchend', () => {
                if (!touchItem) return; touchItem.classList.remove('dragging');
                if (clone) { clone.remove(); clone = null; }
                if (targetItem) { targetItem.classList.remove('drag-over'); const fromId = touchId; const toId = targetItem.dataset.id; if (fromId !== toId) { const notes = getNotes(); const fromIdx = notes.findIndex(n => n.id === fromId); const toIdx = notes.findIndex(n => n.id === toId); if (fromIdx !== -1 && toIdx !== -1) { const [moved] = notes.splice(fromIdx, 1); notes.splice(toIdx, 0, moved); saveNotes(notes); renderPage(); } } }
                touchItem = null; touchId = null; targetItem = null;
            }, { passive: false });
        });
    }

    // ============================
    // Utilities
    // ============================
    function switchView(page, mode) { viewMode[page] = mode; renderPage(); }
    function getCatClass(c) { const all = ['路演','拍视频','广告','商演','短视频','教学','翻跳MV','分享']; return all.includes(c) ? c : 'default'; }
    function getEmptyState(msg) { return `<div class="empty-state"><svg viewBox="0 0 100 100" fill="none"><ellipse cx="50" cy="50" rx="35" ry="30" fill="#FFD9E8" opacity="0.3" stroke="#FFD9E8"/><ellipse cx="25" cy="25" rx="8" ry="12" fill="#FFD9E8" opacity="0.3"/><ellipse cx="75" cy="25" rx="8" ry="12" fill="#FFD9E8" opacity="0.3"/></svg><div class="empty-state-text">${msg}</div></div>`; }
    function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function fmtDate(ts) { const d = new Date(ts); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
    function fmtDateShort(ts) { const d = new Date(ts); const now = new Date(); if (d.toDateString() === now.toDateString()) return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; return `${d.getMonth()+1}/${d.getDate()}`; }

    applyTitle();
    renderPage();
    </script>
